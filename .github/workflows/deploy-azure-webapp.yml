name: Deploy Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-azure-webapp-main
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: seasons-care-api
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: .
  PUBLISH_PATH: ./publish-output

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Apply EF Core migrations
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_DATABASE_CONNECTION_STRING }}
          Jwt__SecretKey: ${{ secrets.AZURE_JWT_SECRET_KEY }}
        run: dotnet ef database update --project ${{ env.PROJECT_PATH }} --startup-project ${{ env.PROJECT_PATH }} --configuration Release --no-build


      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
