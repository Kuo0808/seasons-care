name: Deploy Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-azure-webapp-main
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: seasons-care-api
  AZURE_WEBAPP_URL: https://seasons-care-api-e8g8ebcyhtg6fydf.eastasia-01.azurewebsites.net
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: .
  PUBLISH_PATH: ./publish-output

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}

      - name: Smoke test deployed app
        run: |
          for attempt in {1..15}; do
            status_code=$(curl -s -o response.json -w "%{http_code}" "${{ env.AZURE_WEBAPP_URL }}/healthz")
            if [ "$status_code" = "200" ]; then
              cat response.json
              exit 0
            fi

            echo "Health check attempt ${attempt} failed with status ${status_code}."
            cat response.json || true
            sleep 10
          done

          echo "Smoke test failed after deployment."
          exit 1
